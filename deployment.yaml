
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-event-management
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-event-management
  template:
    metadata:
      labels:
        app: college-event-management
    spec:
      containers:
        - name: college-event-management
          image: jaisshaurya/college-event-management:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: college-event-management-service
spec:
  type: NodePort
  selector:
    app: college-event-management
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30085